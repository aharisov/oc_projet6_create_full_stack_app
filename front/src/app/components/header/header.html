@if (isAuthenticated$ | async) {
  <header class="auth">
    <div class="cont">
      <div class="logo" [routerLink]="['/posts']"><img src="/assets/logo.svg" alt="MDD"></div>
      <nav class="user-menu" [class.active]="isMobileMenuOpen">
        <span class="nav-left">
          <button class="btn-logout" type="button" [disabled]="isLoggingOut" (click)="onLogout()">
            {{ isLoggingOut ? 'Déconnexion...' : 'Se déconnecter' }}
          </button>
          <a [routerLink]="['/posts']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Articles</a>
          <a [routerLink]="['/topics']" routerLinkActive="active" (click)="closeMobileMenu()">Thèmes</a>
        </span>
        <span class="nav-right">
          <a href="#" title="Profil" (click)="closeMobileMenu()">
            <img src="/assets/ic_user.svg" alt="Profil">
          </a>
        </span>
      </nav>
      <button
        type="button"
        class="mobile-burger"
        [class.active]="isMobileMenuOpen"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Ouvrir le menu"
        (click)="toggleMobileMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>
  <div class="menu-backdrop" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
} @else {
  <header class="not-auth">
    <div class="cont">
      <div class="logo" [routerLink]="['/']"><img src="/assets/logo.svg" alt="MDD"></div>
    </div>
  </header>
}
