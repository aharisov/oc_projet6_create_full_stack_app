<div class="posts-page">
  <div class="cont">
    @if (isLoading) {
      <p class="status-info">Chargement des articles...</p>
    } @else if (loadError) {
      <p class="status-error">{{ loadError }}</p>
    } @else if (posts.length === 0) {
      <p class="status-info">Aucun article disponible.</p>
    } @else {
      <app-post-list [posts]="posts" />
    }
  </div>
</div>
