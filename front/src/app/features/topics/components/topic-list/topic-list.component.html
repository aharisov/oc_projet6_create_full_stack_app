<section class="topics-grid">
  @for (topic of topics; track topic.id) {
    <app-topic-item
      [topic]="topic"
      [isSubscribed]="subscribedTopicIds.has(topic.id)"
      [isPending]="pendingTopicIds.has(topic.id)"
      (subscribeRequested)="onSubscribeRequested($event)"
      (unsubscribeRequested)="onUnsubscribeRequested($event)"
    />
  }
</section>
