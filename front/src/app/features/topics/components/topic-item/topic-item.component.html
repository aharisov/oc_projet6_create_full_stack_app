<article class="topic-card">
  <div class="topic-content">
    <h2>{{ topic.name }}</h2>
    <p>{{ topic.description || 'Aucune description disponible.' }}</p>
  </div>
  <button 
    class="btn"
    [class.btn-violet]="!isSubscribed"
    [class.btn-subscribed]="isSubscribed"
    [disabled]="isPending"
    (click)="onToggleSubscription()"
  >
    @if (isPending) {
      {{ isSubscribed ? 'Desabonnement...' : 'Abonnement...' }}
    } @else {
      {{ isSubscribed ? 'Déjà abonné' : "S'abonner" }}
    }
  </button>
</article>
