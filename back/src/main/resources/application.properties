spring.application.name=mddapi
server.servlet.context-path=/api

# Log configuration
logging.level.root=INFO
logging.level.com.openclassrooms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log format and output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %c{1} - %m%n
logging.file.name=logs/mddapi.log
logging.logback.rollingpolicy.file-name-pattern=logs/mddapi.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

#DB configuration
spring.datasource.url=jdbc:mysql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.web.resources.add-mappings=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

server.port=9000

# JWT configuration (milliseconds)
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=1209600000
